plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.minecoloniestweaks'
version = mod_version
base.archivesName = "minecolonies-tweaks-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Smoke checks are development-only; their classes never enter release jars.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    maven { url = 'https://ldtteam.jfrog.io/artifactory/modding' }
    mavenCentral()
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        smoke {
            client()
            sourceSet = sourceSets.smoke
            gameDirectory = file('run-smoke')
            systemProperty 'minecoloniestweaks.smoke', 'true'
        }
        serverSmoke {
            server()
            gameDirectory = file('run-server-smoke')
            programArguments.addAll('--nogui', '--initSettings')
        }
    }
    mods {
        minecoloniestweaks {
            sourceSet sourceSets.main
            sourceSet sourceSets.smoke
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.smoke)

dependencies {
    // Explicit artifacts omit upstream development dependencies. These mods are never bundled.
    implementation "com.ldtteam:minecolonies:${minecolonies_version}@jar"
    implementation "com.ldtteam:structurize:${structurize_version}@jar"
    implementation "com.ldtteam:blockui:${blockui_version}@jar"
    implementation "com.ldtteam:domum-ornamentum:${domum_version}:main@jar"
    implementation "com.ldtteam:multipiston:1.2.58-1.21.1@jar"
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : '[1.21.1]',
            neo_version                : neo_version,
            loader_version_range       : '[1,)',
            minecolonies_version_range : '[1.1.1368-1.21.1,)',
            mod_id                     : 'minecoloniestweaks',
            mod_name                   : 'MineColonies Tweaks',
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : 'Emily and projethub42',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') {
    from('LICENSE')
    from('NOTICE.md')
}
tasks.named('runSmoke') {
    doFirst { delete file('run-smoke/smoke-result.txt') }
    doLast {
        def result = file('run-smoke/smoke-result.txt')
        if (!result.exists() || result.text.trim() != 'PASS') {
            throw new GradleException('Smoke checks failed; see run-smoke/logs/latest.log')
        }
    }
}
